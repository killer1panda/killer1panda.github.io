<body class="bg-bg text-text font-sans flex flex-col md:flex-row h-screen overflow-hidden">

    <div class="panel-section p-5 border-b border-border">

            <option value="network">Network / Nodes</option>

        </div>
      </div>
      <div class="mb-4">
        <label for="input-title" class="block text-[11px] mb-1.5 text-text-muted uppercase tracking-wider font-semibold">Fact Title</label>
        <input type="text" id="input-title" value="Incognito is not invisible" class="w-full p-2.5 bg-bg border border-border rounded-md text-text text-sm focus:outline-none focus:border-accent transition-colors">
      </div>
      <div class="mb-4">

        <textarea id="input-body" rows="3" class="w-full p-2.5 bg-bg border border-border rounded-md text-text text-sm focus:outline-none focus:border-accent transition-colors">Your ISP, school, or employer can still see your active web traffic. Incognito only prevents your browser from saving history locally.</textarea>
      </div>

        <label for="input-prompt" class="block text-[11px] mb-1.5 text-text-muted uppercase tracking-wider font-semibold">Footer Prompt</label>
        <input type="text" id="input-prompt" value="Did you know?" class="w-full p-2.5 bg-bg border border-border rounded-md text-text text-sm focus:outline-none focus:border-accent transition-colors">

    <!-- DYNAMIC TEXT PROPERTIES CUSTOMIZER -->
    <div class="panel-section p-5 border-b border-border bg-blue-500/5" id="section-text-properties" style="display: none;">
      <h2 class="text-[13px] uppercase tracking-wider text-text-muted mb-3 font-semibold">3. Text Properties (<span id="active-element-name" class="text-accent">None</span>)</h2>
      <div class="mb-4 flex gap-2">
        <div class="flex-1">

          <input type="number" id="text-size" value="16" min="8" max="150" step="1" class="w-full p-2.5 bg-bg border border-border rounded-md text-text text-sm focus:outline-none focus:border-accent transition-colors">

        <div class="flex-1">

          <select id="text-weight" class="w-full p-2.5 bg-bg border border-border rounded-md text-text text-sm focus:outline-none focus:border-accent transition-colors">

            <option value="400">Regular</option>

      </div>
      <div class="mb-4 flex gap-2">

              <input type="color" id="text-color" value="#ffffff" class="absolute -top-1 -left-1 w-[30px] h-[30px] border-none cursor-pointer bg-transparent opacity-0">

        <div class="flex-1">

            <option value="center">Center</option>

            <option value="justify">Justify</option>

      <div class="mb-4 flex gap-2">
        <div class="flex-1">

        </div>

    <div class="panel-section p-5 border-b border-border">
      <h2 class="text-[13px] uppercase tracking-wider text-text-muted mb-3 font-semibold">4. Branding & Customization</h2>
      <div class="mb-4 flex gap-2">
        <div class="flex-1">
          <label for="input-handle" class="block text-[11px] mb-1.5 text-text-muted uppercase tracking-wider font-semibold">Society Handle</label>
          <input type="text" id="input-handle" value="@ieee_cis_upes" class="w-full p-2.5 bg-bg border border-border rounded-md text-text text-sm focus:outline-none focus:border-accent transition-colors">
        </div>
        <div class="flex-1">
          <label for="input-chapter" class="block text-[11px] mb-1.5 text-text-muted uppercase tracking-wider font-semibold">Chapter Layout</label>
          <select id="input-chapter" class="w-full p-2.5 bg-bg border border-border rounded-md text-text text-sm focus:outline-none focus:border-accent transition-colors">
            <option value="cis">IEEE CIS UPES</option>

      </div>
      <div class="mb-4">
        <label for="input-color" class="block text-[11px] mb-1.5 text-text-muted uppercase tracking-wider font-semibold">Theme Accent Color</label>
        <div class="flex items-center gap-2.5 bg-[#0c0c0e] border border-border p-1.5 px-2.5 rounded-md mt-1">
          <div class="w-5 h-5 rounded-sm border border-neutral-300 relative overflow-hidden bg-[#39ff14]" id="input-color-preview">
            <input type="color" id="input-color" value="#39ff14" class="absolute -top-1 -left-1 w-[30px] h-[30px] border-none cursor-pointer bg-transparent opacity-0">
          </div>
          <span id="input-color-value" class="font-mono text-xs text-text-muted">#39FF14</span>
        </div>
      </div>
      <button class="w-full p-2.5 bg-border text-text rounded-md cursor-pointer font-semibold mb-2 text-[13px] hover:bg-zinc-700 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" id="btn-upload">📷 Upload Custom Logo</button>
      <input type="file" id="file-upload" accept="image/*" class="hidden">
      <button class="w-full p-2.5 bg-border text-text rounded-md cursor-pointer font-semibold mb-2 text-[13px] hover:bg-zinc-700 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" id="btn-upload-illustration">📷 Upload Custom Illustration</button>
      <input type="file" id="file-upload-illustration" accept="image/*" class="hidden">
    </div>
    
    <div class="panel-section p-5 border-b border-border">
      <h2 class="text-[13px] uppercase tracking-wider text-text-muted mb-3 font-semibold">5. Formats & Export</h2>
      <div class="mb-4">
        <label for="input-format" class="block text-[11px] mb-1.5 text-text-muted uppercase tracking-wider font-semibold">Format Ratio</label>

        </select>

      <button class="w-full p-2.5 bg-rose-600 hover:bg-rose-700 text-text rounded-md cursor-pointer font-semibold mb-2 text-[13px] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" id="btn-reset">↺ Reset Transform & Style States</button>
      <div class="mt-4 flex gap-2">
        <button class="flex-1 p-2.5 bg-accent hover:bg-accent-hover text-text rounded-md cursor-pointer font-semibold text-[13px] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" id="btn-dl-png">Export PNG</button>
        <button class="flex-1 p-2.5 bg-accent hover:bg-accent-hover text-text rounded-md cursor-pointer font-semibold text-[13px] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" id="btn-dl-jpg">Export JPG</button>
      </div>

        <label for="input-duration" class="block text-[11px] mb-1.5 text-text-muted uppercase tracking-wider font-semibold">Animated Video Duration (sec)</label>
        <input type="number" id="input-duration" value="5" min="1" max="30" class="w-full p-2.5 bg-bg border border-border rounded-md text-text text-sm focus:outline-none focus:border-accent transition-colors">
      </div>
      <button class="w-full p-2.5 bg-violet-600 hover:bg-violet-700 text-text rounded-md cursor-pointer font-semibold mb-2 text-[13px] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" id="btn-dl-mp4">Export MP4 Video</button>
    </div>

  <!-- WORKSPACE -->
  <main class="workspace flex-1 flex flex-col relative order-1 md:order-none">
    <div class="topbar h-[60px] border-b border-border bg-panel flex justify-between items-center px-5">
      <div class="flex items-center gap-3.5">
        <a href="../index.html" class="text-text-muted no-underline text-xs inline-flex items-center gap-1.5 bg-border hover:bg-zinc-700 px-2.5 py-1.5 rounded font-medium transition-colors">
          ← Dashboard
        </a>
        <div class="font-semibold">Tech Facts Creator</div>
      </div>
      <div class="text-text-muted text-xs">Automated Canvas alignment lines active</div>
    </div>
    <div class="canvas-container flex-1 flex justify-center items-center overflow-hidden p-10 bg-black relative min-h-[600px] md:min-h-0" id="canvas-container">
      <div id="scale-wrapper" class="absolute left-1/2 top-1/2 origin-center transition-transform duration-200">
        <div id="renderer-target" class="w-full h-full block"></div>
      </div>
    </div>
  </main>

  <!-- OVERLAY -->
  <div id="overlay" class="fixed inset-0 bg-black/80 z-[9999] hidden flex-col justify-center items-center text-white">
    <h2 id="overlay-text" class="text-xl font-bold uppercase tracking-wider">Generating Video...</h2>
    <p class="mt-2 text-[13px] text-text-muted">Please wait, rendering frames in client browser sandbox.</p>
  </div>

  <script>
    const renderer = new TechFactRenderer('renderer-target');
    const FORMATS = {
      "9:16": { w: 1080, h: 1920 },
      "1:1":  { w: 1080, h: 1080 },
      "4:5":  { w: 1080, h: 1350 },
      "16:9": { w: 1920, h: 1080 }
    };

    let appState = JSON.parse(localStorage.getItem('techFactsState')) || {
      style: "01",
      category: "CYBERSECURITY",
      title: "Incognito is not invisible",
      body: "Your ISP, school, or employer can still see your active web traffic. Incognito only prevents your browser from saving history locally.",
      prompt: "Did you know?",
      iconKey: "cybersecurity",
      handle: "@ieee_cis_upes",
      chapter: "cis",
      accentColor: "#39ff14",
      logoDataUrl: null,
      format: "9:16",
      transforms: {},
      textStyles: {}
    };

    function saveState() {
      localStorage.setItem('techFactsState', JSON.stringify(appState));
    }

    // Populate Sidebar Style Grid
    const grid = document.getElementById('style-grid');
    TECH_FACTS_REGISTRY.forEach(s => {
      const el = document.createElement('button');
      el.className = 'style-thumb' + (s.id === appState.style ? ' active' : '');
      el.type = 'button';
      el.innerText = s.name;
      el.setAttribute('aria-pressed', s.id === appState.style ? 'true' : 'false');
      el.onclick = () => {
        document.querySelectorAll('.style-thumb').forEach(e => {
          e.classList.remove('active');
          e.setAttribute('aria-pressed', 'false');
        });
        el.classList.add('active');
        el.setAttribute('aria-pressed', 'true');
        appState.style = s.id;
        
        // Auto-assign default theme accent color
        const themeAccents = {
          "01": "#39ff14",
          "02": "#6366f1",
          "03": "#09090b",
          "04": "#00f0ff",
          "05": "#d97706",
          "06": "#a855f7",
          "07": "#8b5cf6",
          "08": "#ffffff",
          "09": "#000000",
          "10": "#00e5ff",
          "11": "#00fbfb",
          "12": "#8127cf",
          "13": "#000000",
          "14": "#ff00ff",
          "15": "#10b981",
          "16": "#f97316",
          "17": "#8b5cf6",
          "18": "#84cc16",
          "19": "#06b6d4",
          "20": "#d946ef",
          "21": "#000000",
          "22": "#f97316",
          "23": "#06b6d4",
          "24": "#000000",
          "25": "#000000",
          "26": "#fdf8f8",
          "27": "#2b2924",
          "28": "#1f2937",
          "29": "#38bdf8",
          "30": "#39ff14"
        };
        appState.accentColor = themeAccents[s.id] || "#39ff14";
        document.getElementById('input-color').value = appState.accentColor;
        updateColorPreviews();
        renderApp();
      };
      grid.appendChild(el);
    });

    // Populate input fields from saved state
    document.getElementById('input-category').value = appState.category;
    document.getElementById('input-title').value = appState.title;
    document.getElementById('input-body').value = appState.body;
    document.getElementById('input-prompt').value = appState.prompt || "Did you know?";
    document.getElementById('input-icon').value = appState.iconKey;
    document.getElementById('input-handle').value = appState.handle;
    document.getElementById('input-chapter').value = appState.chapter;
    document.getElementById('input-color').value = appState.accentColor;
    document.getElementById('input-format').value = appState.format;

    // Register Input Event listeners
    document.getElementById('input-category').oninput = (e) => { appState.category = e.target.value; updateData(); };
    document.getElementById('input-title').oninput = (e) => { appState.title = e.target.value; updateData(); };
    document.getElementById('input-body').oninput = (e) => { appState.body = e.target.value; updateData(); };
    document.getElementById('input-prompt').oninput = (e) => { appState.prompt = e.target.value; updateData(); };
    document.getElementById('input-icon').onchange = (e) => { appState.iconKey = e.target.value; updateData(); };
    document.getElementById('input-handle').oninput = (e) => { appState.handle = e.target.value; updateData(); };
    document.getElementById('input-chapter').onchange = (e) => { appState.chapter = e.target.value; updateData(); };
    document.getElementById('input-color').onchange = (e) => {
      appState.accentColor = e.target.value;
      updateColorPreviews();
      renderApp();
    };
    document.getElementById('input-format').onchange = (e) => { appState.format = e.target.value; renderApp(); };

    // Logo upload
    document.getElementById('btn-upload').onclick = () => document.getElementById('file-upload').click();
    document.getElementById('file-upload').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        appState.logoDataUrl = ev.target.result;
        updateData();
      };
      reader.readAsDataURL(file);
    };

    // Illustration upload
    document.getElementById('btn-upload-illustration').onclick = () => document.getElementById('file-upload-illustration').click();
    document.getElementById('file-upload-illustration').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        appState.illustrationDataUrl = ev.target.result;
        updateData();
      };
      reader.readAsDataURL(file);
    };

    // Reset Layout and styles
    document.getElementById('btn-reset').onclick = () => {
      appState.transforms = {};
      appState.textStyles = {};
      appState.illustrationDataUrl = null;
      document.getElementById('section-text-properties').style.display = 'none';
      renderApp();
    };

    // Exports
    document.getElementById('btn-dl-png').onclick = () => renderer.exportImage('png');
    document.getElementById('btn-dl-jpg').onclick = () => renderer.exportImage('jpg');
    document.getElementById('btn-dl-mp4').onclick = () => {
      const durationSec = parseInt(document.getElementById('input-duration').value) || 5;
      renderer.exportVideo(durationSec);
    };

    // Dynamic Text Properties listeners
    document.getElementById('text-size').oninput = updateActiveElementStyle;
    document.getElementById('text-weight').onchange = updateActiveElementStyle;
    document.getElementById('text-color').oninput = () => { updateActiveElementStyle(); updateColorPreviews(); };
    document.getElementById('text-align').onchange = updateActiveElementStyle;
    document.getElementById('text-spacing').oninput = updateActiveElementStyle;
    document.getElementById('text-height').oninput = updateActiveElementStyle;

    // Helper functions for selection panel
    function rgbToHex(rgb) {
      if (!rgb) return '#ffffff';
      const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*(\d+(?:\.\d+)?))?\)$/);
      if (!match) return '#ffffff';
      const r = parseInt(match[1]);
      const g = parseInt(match[2]);
      const b = parseInt(match[3]);
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toLowerCase();
    }

    window.selectElement = function(tid) {
      appState.activeElementTid = tid;
      const panel = document.getElementById('section-text-properties');
      const nameSpan = document.getElementById('active-element-name');
      
      if (!tid || tid === 'icon' || tid === 'logo') {
        panel.style.display = 'none';
        return;
      }
      
      panel.style.display = 'block';
      nameSpan.innerText = tid.toUpperCase();
      
      // Query current style settings of selected element inside iframe
      const iframeDoc = renderer.iframe.contentDocument || renderer.iframe.contentWindow.document;
      const el = iframeDoc.querySelector(`[data-tid="${tid}"]`);
      if (el) {
        const comp = renderer.iframe.contentWindow.getComputedStyle(el);
        
        const fontSizePx = Math.round(parseFloat(comp.fontSize)) || 16;
        const fontWeight = comp.fontWeight || '400';
        const colorHex = rgbToHex(comp.color) || '#ffffff';
        const textAlign = comp.textAlign || 'left';
        
        let letterSpacing = comp.letterSpacing;
        if (letterSpacing === 'normal') letterSpacing = 0;
        else letterSpacing = parseFloat(letterSpacing) || 0;
        
        let lineHeight = comp.lineHeight;
        if (lineHeight === 'normal') lineHeight = 1.2;
        else {
          const lhFloat = parseFloat(lineHeight);
          lineHeight = isNaN(lhFloat) ? 1.2 : (lhFloat / fontSizePx).toFixed(1);
        }
        
        document.getElementById('text-size').value = fontSizePx;
        document.getElementById('text-weight').value = fontWeight;
        document.getElementById('text-color').value = colorHex;
        document.getElementById('text-align').value = textAlign;
        document.getElementById('text-spacing').value = letterSpacing;
        document.getElementById('text-height').value = lineHeight;
        updateColorPreviews();
      }
    };

    function updateActiveElementStyle() {
      const tid = appState.activeElementTid;
      if (!tid) return;
      
      const size = document.getElementById('text-size').value;
      const weight = document.getElementById('text-weight').value;
      const color = document.getElementById('text-color').value;
      const align = document.getElementById('text-align').value;
      const spacing = document.getElementById('text-spacing').value;
      const height = document.getElementById('text-height').value;
      
      if (!appState.textStyles) appState.textStyles = {};
      appState.textStyles[tid] = {
        fontSize: size,
        fontWeight: weight,
        color: color,
        textAlign: align,
        letterSpacing: spacing,
        lineHeight: height
      };
      
      const iframeDoc = renderer.iframe.contentDocument || renderer.iframe.contentWindow.document;
      const el = iframeDoc.querySelector(`[data-tid="${tid}"]`);
      if (el) {
        el.style.fontSize = size + 'px';
        el.style.fontWeight = weight;
        el.style.color = color;
        el.style.textAlign = align;
        el.style.letterSpacing = spacing + 'px';
        el.style.lineHeight = height;
      }
      
      saveState();
    }

    function updateColorPreviews() {
      const inputColor = document.getElementById('input-color');
      const inputColorVal = document.getElementById('input-color-value');
      const inputColorPreview = document.getElementById('input-color-preview');
      if (inputColor && inputColorVal && inputColorPreview) {
        inputColorVal.innerText = inputColor.value.toUpperCase();
        inputColorPreview.style.backgroundColor = inputColor.value;
      }
      
      const textColor = document.getElementById('text-color');
      const textColorVal = document.getElementById('text-color-value');
      const textColorPreview = document.getElementById('text-color-preview');
      if (textColor && textColorVal && textColorPreview) {
        textColorVal.innerText = textColor.value.toUpperCase();
        textColorPreview.style.backgroundColor = textColor.value;
      }
    }

    // Core Scaling and Rendering
    async function renderApp() {
      await renderer.loadTemplate(appState.style, appState);
      const dims = FORMATS[appState.format];
      renderer.setDimensions(dims.w, dims.h);
      updateData();
      applyWorkspaceScaling();
    }

    function updateData() {
      renderer.updateData(appState);
      saveState();
    }

    function applyWorkspaceScaling() {
      const wrapper = document.getElementById('scale-wrapper');
      const container = document.getElementById('canvas-container');
      if (!wrapper || !container) return;
      const dims = FORMATS[appState.format];

      const scaleX = (container.clientWidth - 80) / dims.w;
      const scaleY = (container.clientHeight - 80) / dims.h;
      const scale = Math.min(scaleX, scaleY, 1);

      wrapper.style.width = dims.w + 'px';
      wrapper.style.height = dims.h + 'px';
      wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', applyWorkspaceScaling);
    updateColorPreviews();
    renderApp();
  </script>
</body>
</html>
