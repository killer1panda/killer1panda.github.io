<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Fact of the Day — Creator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.8/dist/ffmpeg.min.js"></script>
  <script src="registry.js"></script>
  <script src="renderer.js"></script>
  <style>
    :root {
      --bg: #09090b; --panel: #18181b; --border: #27272a;
      --text: #fafafa; --text-muted: #a1a1aa;
      --accent: #3b82f6; --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; height: 100vh; overflow: hidden;
    }
    
    /* ─── SIDEBAR ─── */
    .sidebar {
      width: 340px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto;
      flex-shrink: 0;
    }
    .panel-section { padding: 20px; border-bottom: 1px solid var(--border); }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 12px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], textarea, select, input[type="color"] {
      width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-family: inherit; font-size: 14px;
    }
    input[type="color"] {
      height: 40px; padding: 2px; cursor: pointer;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    
    .btn {
      width: 100%; padding: 10px; background: var(--border); color: var(--text);
      border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 8px;
      font-size: 13px;
    }
    .btn:hover { background: #3f3f46; }
    .btn-primary { background: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: #e11d48; }
    
    .flex-row { display: flex; gap: 8px; }
    .flex-row .btn { flex: 1; }
    
    /* ─── GALLERY ─── */
    .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 200px; overflow-y: auto; }
    .style-thumb {
      background: var(--bg); border: 1px solid var(--border); padding: 10px;
      border-radius: 6px; cursor: pointer; text-align: center; font-size: 11px;
      font-weight: 600;
    }
    .style-thumb:hover, .style-thumb.active { border-color: var(--accent); color: var(--accent); }
    
    /* ─── WORKSPACE ─── */
    .workspace {
      flex: 1; display: flex; flex-direction: column; position: relative;
    }
    .topbar {
      height: 60px; border-bottom: 1px solid var(--border); background: var(--panel);
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .canvas-container {
      flex: 1; display: flex; justify-content: center; align-items: center;
      overflow: hidden; padding: 40px; background: #000;
      position: relative;
    }
    
    #scale-wrapper {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      transition: transform 0.2s;
    }
    #renderer-target, #renderer-target iframe {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999;
      display: none; justify-content: center; align-items: center; flex-direction: column; color: white;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="panel-section">
      <h2>1. Fact Styles</h2>
      <div class="style-grid" id="style-grid"></div>
    </div>
    
    <div class="panel-section">
      <h2>2. Fact Content</h2>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="input-category" value="CYBERSECURITY">
      </div>
      <div class="form-group">
        <label>Fact Title</label>
        <input type="text" id="input-title" value="Incognito is not invisible">
      </div>
      <div class="form-group">
        <label>Fact Description</label>
        <textarea id="input-body" rows="4">Your ISP, school, or employer can still see your active web traffic. Incognito only prevents your browser from saving history locally.</textarea>
      </div>
      <div class="form-group">
        <label>Icon Theme</label>
        <select id="input-icon">
          <option value="ai">Artificial Intelligence</option>
          <option value="cybersecurity" selected>Cybersecurity / Shield</option>
          <option value="code">Code / Development</option>
          <option value="hardware">Hardware / Chip</option>
          <option value="cloud">Cloud Storage</option>
          <option value="database">Database / Storage</option>
          <option value="mobile">Mobile / Smartphone</option>
          <option value="network">Network / Nodes</option>
          <option value="history">History / Clock</option>
          <option value="gaming">Console / Gaming</option>
        </select>
      </div>
    </div>

    <div class="panel-section">
      <h2>3. Branding & Customization</h2>
      <div class="form-group">
        <label>Society Handle</label>
        <input type="text" id="input-handle" value="@ieee_cis_upes">
      </div>
      <div class="form-group">
        <label>Chapter Layout</label>
        <select id="input-chapter">
          <option value="cis">IEEE CIS UPES</option>
          <option value="sps">IEEE SPS UPES</option>
        </select>
      </div>
      <div class="form-group">
        <label>Accent Color</label>
        <input type="color" id="input-color" value="#39ff14">
      </div>
      <button class="btn" id="btn-upload">📷 Upload Custom Logo</button>
      <input type="file" id="file-upload" accept="image/*" style="display:none;">
    </div>
    
    <div class="panel-section">
      <h2>4. Formats & Export</h2>
      <div class="form-group">
        <label>Format Ratio</label>
        <select id="input-format">
          <option value="9:16">Instagram Story (9:16)</option>
          <option value="1:1">Instagram Post (1:1)</option>
          <option value="4:5">Instagram Portrait (4:5)</option>
          <option value="16:9">Landscape Banner (16:9)</option>
        </select>
      </div>
      <button class="btn btn-danger" id="btn-reset">↺ Reset Transform State</button>
      <br><br>
      <button class="btn btn-primary" id="btn-dl-png">Export PNG</button>
      <button class="btn btn-primary" id="btn-dl-jpg">Export JPG</button>
      
      <div class="form-group" style="margin-top:10px;">
        <label>Animated Video Duration (sec)</label>
        <input type="number" id="input-duration" value="5" min="1" max="30">
      </div>
      <button class="btn btn-primary" style="background:#8b5cf6;" id="btn-dl-mp4">Export MP4 Video</button>
    </div>
  </aside>

  <!-- WORKSPACE -->
  <main class="workspace">
    <div class="topbar">
      <div style="display: flex; align-items: center; gap: 15px;">
        <a href="../index.html" style="color: var(--text-muted); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; background: var(--border); padding: 5px 10px; border-radius: 4px; font-weight: 500;">
          ← Dashboard
        </a>
        <div style="font-weight: 600;">Tech Facts Creator</div>
      </div>
      <div style="color: var(--text-muted); font-size: 12px;">Automated Canvas alignment lines active</div>
    </div>
    <div class="canvas-container" id="canvas-container">
      <div id="scale-wrapper">
        <div id="renderer-target"></div>
      </div>
    </div>
  </main>

  <div id="overlay">
    <h2 id="overlay-text">Generating Video...</h2>
    <p style="margin-top: 10px; font-size: 13px; color: var(--text-muted);">Please wait, rendering frames in client browser sandbox.</p>
  </div>

  <script>
    const renderer = new TechFactRenderer('renderer-target');
    const FORMATS = {
      "9:16": { w: 1080, h: 1920 },
      "1:1":  { w: 1080, h: 1080 },
      "4:5":  { w: 1080, h: 1350 },
      "16:9": { w: 1920, h: 1080 }
    };

    let appState = JSON.parse(localStorage.getItem('techFactsState')) || {
      style: "01",
      category: "CYBERSECURITY",
      title: "Incognito is not invisible",
      body: "Your ISP, school, or employer can still see your active web traffic. Incognito only prevents your browser from saving history locally.",
      iconKey: "cybersecurity",
      handle: "@ieee_cis_upes",
      chapter: "cis",
      accentColor: "#39ff14",
      logoDataUrl: null,
      format: "9:16",
      transforms: {}
    };

    function saveState() {
      localStorage.setItem('techFactsState', JSON.stringify(appState));
    }

    // Populate Sidebar Style Grid
    const grid = document.getElementById('style-grid');
    TECH_FACTS_REGISTRY.forEach(s => {
      const el = document.createElement('div');
      el.className = 'style-thumb' + (s.id === appState.style ? ' active' : '');
      el.innerText = s.name;
      el.onclick = () => {
        document.querySelectorAll('.style-thumb').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        appState.style = s.id;
        
        // Auto-assign default theme accent color for better design flow
        const themeAccents = {
          "01": "#39ff14",
          "02": "#6366f1",
          "03": "#09090b",
          "04": "#00f0ff",
          "05": "#d97706",
          "06": "#a855f7",
          "07": "#8b5cf6",
          "08": "#ffffff",
          "09": "#000000",
          "10": "#00e5ff"
        };
        appState.accentColor = themeAccents[s.id] || "#39ff14";
        document.getElementById('input-color').value = appState.accentColor;
        
        renderApp();
      };
      grid.appendChild(el);
    });

    // Populate input fields from saved state
    document.getElementById('input-category').value = appState.category;
    document.getElementById('input-title').value = appState.title;
    document.getElementById('input-body').value = appState.body;
    document.getElementById('input-icon').value = appState.iconKey;
    document.getElementById('input-handle').value = appState.handle;
    document.getElementById('input-chapter').value = appState.chapter;
    document.getElementById('input-color').value = appState.accentColor;
    document.getElementById('input-format').value = appState.format;

    // Register Input Event listeners
    document.getElementById('input-category').oninput = (e) => { appState.category = e.target.value; updateData(); };
    document.getElementById('input-title').oninput = (e) => { appState.title = e.target.value; updateData(); };
    document.getElementById('input-body').oninput = (e) => { appState.body = e.target.value; updateData(); };
    document.getElementById('input-icon').onchange = (e) => { appState.iconKey = e.target.value; updateData(); };
    document.getElementById('input-handle').oninput = (e) => { appState.handle = e.target.value; updateData(); };
    document.getElementById('input-chapter').onchange = (e) => { appState.chapter = e.target.value; updateData(); };
    document.getElementById('input-color').onchange = (e) => { appState.accentColor = e.target.value; renderApp(); };
    document.getElementById('input-format').onchange = (e) => { appState.format = e.target.value; renderApp(); };

    // Logo upload
    document.getElementById('btn-upload').onclick = () => document.getElementById('file-upload').click();
    document.getElementById('file-upload').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        appState.logoDataUrl = ev.target.result;
        updateData();
      };
      reader.readAsDataURL(file);
    };

    // Reset Layout
    document.getElementById('btn-reset').onclick = () => {
      appState.transforms = {};
      renderApp();
    };

    // Exports
    document.getElementById('btn-dl-png').onclick = () => renderer.exportImage('png');
    document.getElementById('btn-dl-jpg').onclick = () => renderer.exportImage('jpg');
    document.getElementById('btn-dl-mp4').onclick = () => {
      const durationSec = parseInt(document.getElementById('input-duration').value) || 5;
      renderer.exportVideo(durationSec);
    };

    // Core Scaling and Rendering
    async function renderApp() {
      await renderer.loadTemplate(appState.style, appState);
      const dims = FORMATS[appState.format];
      renderer.setDimensions(dims.w, dims.h);
      updateData();
      applyWorkspaceScaling();
    }

    function updateData() {
      renderer.updateData(appState);
      saveState();
    }

    function applyWorkspaceScaling() {
      const wrapper = document.getElementById('scale-wrapper');
      const container = document.getElementById('canvas-container');
      if (!wrapper || !container) return;
      const dims = FORMATS[appState.format];

      const scaleX = (container.clientWidth - 80) / dims.w;
      const scaleY = (container.clientHeight - 80) / dims.h;
      const scale = Math.min(scaleX, scaleY, 1);

      wrapper.style.width = dims.w + 'px';
      wrapper.style.height = dims.h + 'px';
      wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', applyWorkspaceScaling);
    renderApp();
  </script>
</body>
</html>
